name: slim-build

on:
  workflow_dispatch:
  push:
    tags: ['slim-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: 安装 upx
        run: sudo apt-get update && sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: 构建 slim（armv7 / arm64 / amd64）
        env:
          TARGETS: linux-armv7 linux-arm64 linux-amd64
        run: ./scripts/build-slim.sh

      - name: 汇总校验值
        run: |
          cd dist && ls -l && sha256sum mihomo-* > checksums.txt && cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-slim
          path: dist/*

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/slim-')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
